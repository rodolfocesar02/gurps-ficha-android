<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>24 Pacotes de Ícones - Preview Visual</title>
  <style>
    :root { --bg:#f1f4fb; --card:#fff; --line:#d5dcef; --text:#1d2540; --muted:#607095; --chip:#e8eefc; --accent:#1e3566; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1400px; margin:20px auto 36px; padding:0 14px; }
    h1 { margin:0 0 8px; color:var(--accent); }
    .hint { margin:0 0 14px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:10px; }
    .card { border:1px solid var(--line); background:var(--card); border-radius:12px; padding:10px; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .name { font-size:22px; font-weight:800; color:#1f3768; }
    .chip { font-size:12px; border:1px solid #c9d6f8; background:var(--chip); color:#2a467f; border-radius:999px; padding:3px 8px; font-weight:700; }
    .bar { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; padding:8px; border:1px dashed #c9d2ea; border-radius:10px; background:#f8faff; }
    .slot { text-align:center; }
    .ico { font-size:28px; line-height:1; display:block; }
    .lbl { margin-top:4px; font-size:10px; color:#56688f; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>24 Pacotes de Ícones (Preview Visual)</h1>
    <p class="hint">Agora com ícones visuais renderizados. Ordem fixa: Geral, Traços, Perícias, Técnicas, Magia, Equip., Defesas, Rolagem.</p>
    <div id="grid" class="grid"></div>
  </div>
  <script>
    const tabs = ["Geral","Traços","Perícias","Técnicas","Magia","Equip.","Defesas","Rolagem"];
    const pkgs = [
      { code:"M01", theme:"Minimalista", icons:["👤","⭐","📊","🎯","📘","🎒","🛡️","🎲"] },
      { code:"M02", theme:"Minimalista", icons:["🙂","🔶","📈","◎","📖","🧰","⬡","🧊"] },
      { code:"M03", theme:"Minimalista", icons:["🧑","🏅","📉","🎯","📗","👜","🛡","🎲"] },
      { code:"M04", theme:"Minimalista", icons:["🧍","🏵️","▮▮▮","✚","📕","📦","🛡️","🎲"] },
      { code:"M05", theme:"Minimalista", icons:["🧑‍💼","💠","📶","🎯","📚","🎒","🛡️","🧊"] },
      { code:"M06", theme:"Minimalista", icons:["👥","⬢","📊","🎯","📘","🧳","⬣","🎲"] },
      { code:"M07", theme:"Minimalista", icons:["🙍","✦","〽️","◎","📔","👜","🛡","🎲"] },
      { code:"M08", theme:"Minimalista", icons:["🅶","🆃","🅿","🅺","🅼","🅴","🅳","🆁"] },

      { code:"MD01", theme:"Medieval", icons:["🛡","📜","⚒️","⚔️","📖","🧺","🛡️","🎲"] },
      { code:"MD02", theme:"Medieval", icons:["ᚠ","ᚱ","ᚦ","ᚺ","ᛗ","ᛖ","ᛞ","ᚱ"] },
      { code:"MD03", theme:"Medieval", icons:["🏰","🪙","🛠️","🗡️","🕯️","🧰","🛡","🎲"] },
      { code:"MD04", theme:"Medieval", icons:["🪖","🎖️","🚩","🗡️","🏺","🎒","🛡️","🎲"] },
      { code:"MD05", theme:"Medieval", icons:["🧙","✨","🧭","🗡️","🔮","🎒","🛡","🎲"] },
      { code:"MD06", theme:"Medieval", icons:["⛪","📿","✒️","🦯","📜","🧺","🛡️","🎲"] },
      { code:"MD07", theme:"Medieval", icons:["☘️","🗿","🪓","⚔️","🪨","🎒","🛡","🎲"] },
      { code:"MD08", theme:"Medieval", icons:["👑","🏵️","📜","🤺","📘","🧰","🛡️","🎲"] },

      { code:"T01", theme:"Técnico", icons:["🧑‍💻","🪪","📊","🎯","📘","🎒","🛡️","🎲"] },
      { code:"T02", theme:"Técnico", icons:["👤","📐","📈","⊕","📕","🧰","⬢","🧊"] },
      { code:"T03", theme:"Técnico", icons:["🤖","💳","📉","🎯","⚡","🗃️","🛡","🎲"] },
      { code:"T04", theme:"Técnico", icons:["🪪","🎖️","📡","🎯","🔷","🎒","🛡️","🎲"] },
      { code:"T05", theme:"Técnico", icons:["🧑","🏷️","📈","🛠️","🧿","📦","🧱","🧊"] },
      { code:"T06", theme:"Técnico", icons:["👤","📍","📊","◎","✴️","🧰","🛡","🎲"] },
      { code:"T07", theme:"Técnico", icons:["🛰️","🔹","📶","🎯","📘","🎒","🛡️","🎲"] },
      { code:"T08", theme:"Técnico", icons:["⬢","⬡","📊","⊗","✶","🧳","⬣","🧊"] }
    ];

    const grid = document.getElementById("grid");
    pkgs.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      const top = document.createElement("div");
      top.className = "top";
      top.innerHTML = `<div class="name">${p.code}</div><div class="chip">${p.theme}</div>`;
      card.appendChild(top);

      const bar = document.createElement("div");
      bar.className = "bar";
      p.icons.forEach((icon, i) => {
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.innerHTML = `<span class="ico">${icon}</span><div class="lbl">${tabs[i]}</div>`;
        bar.appendChild(slot);
      });
      card.appendChild(bar);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
