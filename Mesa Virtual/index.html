<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GURPS VTT - Console Mestre Profissional</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A5D8A;
            --bg: #0d0e12;
            --border: rgba(255,255,255,0.1);
            --text: #e0e0e0;
            --red: #ff5252;
            --green: #4caf50;
            --gold: #ffc107;
            --purple: #9c27b0;
        }

        body { background-color: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .global-header { background: rgba(0,0,0,0.5); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .upload-btn { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; border: none; }

        .gallery { flex: 1; display: flex; gap: 30px; padding: 30px; overflow-x: auto; align-items: flex-start; scrollbar-width: thin; }

        .device { width: 355px; height: 800px; background: #000; border-radius: 45px; padding: 10px; border: 4px solid #333; display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 0 10px 40px rgba(0,0,0,0.5); position: relative; }
        .close-btn { position: absolute; top: -10px; right: -10px; background: var(--red); color: white; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; font-weight: bold; z-index: 10; }

        .screen { background: #fff; border-radius: 35px; flex: 1; display: flex; flex-direction: column; overflow: hidden; color: #333; }
        .app-bar { background: var(--primary); color: white; padding: 25px 10px 10px; text-align: center; }
        .app-bar h2 { margin: 0; font-size: 13px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tabs { display: flex; background: #f0f0f0; border-bottom: 1px solid #ddd; overflow-x: auto; scrollbar-width: none; }
        .tab-btn { flex-shrink: 0; border: none; background: none; padding: 12px 10px; font-size: 9px; font-weight: 700; color: #888; cursor: pointer; text-transform: uppercase; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        .sheet-body { flex: 1; overflow-y: auto; padding: 15px; font-size: 11px; scrollbar-width: none; }
        .section-header { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; margin: 15px 0 5px; border-bottom: 1px solid #eee; padding-bottom: 2px; }
        
        .attr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
        .attr-box { background: #fdfdfd; border: 1px solid #eee; border-radius: 6px; text-align: center; padding: 5px 0; }
        .attr-val { font-size: 18px; font-weight: 700; color: var(--primary); }

        .list-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dotted #eee; align-items: center; }
        .nh-tag { background: var(--primary); color: white; padding: 2px 8px; border-radius: 4px; font-weight: 700; min-width: 25px; text-align: center; }
        .tag { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; color: #666; }

        .controls { display: flex; gap: 5px; align-items: center; }
        .c-btn { width: 22px; height: 22px; border-radius: 4px; border: none; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .c-plus { background: var(--green); }
        .c-minus { background: var(--red); }

        .rd-card { background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 4px solid var(--primary); }
        .rd-card.special { border-left-color: var(--red); }
        .rd-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
        .rd-badge { display: flex; align-items: center; gap: 5px; background: white; padding: 2px 5px; border-radius: 4px; border: 1px solid #ddd; }
        
        .dmg-ctrl { display: flex; gap: 4px; align-items: center; }
        .dmg-input { width: 40px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; }
        .dmg-select { padding: 4px; font-size: 9px; border-radius: 4px; flex: 1; }
        .apply-btn { background: var(--red); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 9px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="global-header">
        <h2>Mesa Virtual GURPS</h2>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ ADICIONAR JOGADOR</button>
        <input type="file" id="fileInput" style="display:none" multiple onchange="loadFiles(event)">
    </div>

    <div class="gallery" id="gallery"></div>

    <script>
        let deviceCount = 0;
        
        const DAMAGE_RULES = {
            'cont': { n: 'Contusão (cr)', m: 1.0 },
            'corte': { n: 'Corte (cut)', m: 1.5 },
            'pi-': { n: 'Perfurante- (pi-)', m: 0.5 },
            'pi': { n: 'Perfurante (pi)', m: 1.0 },
            'pi+': { n: 'Perfurante+ (pi+)', m: 1.5 },
            'pi++': { n: 'Perfurante++ (pi++)', m: 2.0 },
            'perf': { n: 'Perfuração (perf)', m: 2.0 }
        };

        const getStDmg = (st) => {
            const table = {
                1: ["1d-6", "1d-6"], 2: ["1d-6", "1d-6"], 3: ["1d-5", "1d-5"], 4: ["1d-5", "1d-5"],
                5: ["1d-4", "1d-4"], 6: ["1d-4", "1d-4"], 7: ["1d-3", "1d-3"], 8: ["1d-3", "1d-3"],
                9: ["1d-2", "1d-1"], 10: ["1d-2", "1d"], 11: ["1d-1", "1d+1"], 12: ["1d-1", "1d+2"],
                13: ["1d", "2d-1"], 14: ["1d", "2d"], 15: ["1d+1", "2d+1"], 16: ["1d+1", "2d+2"],
                17: ["1d+2", "3d-1"], 18: ["1d+2", "3d"], 19: ["2d-1", "3d+1"], 20: ["2d-1", "3d+2"]
            };
            return table[st] || ["-", "-"];
        };

        function loadFiles(e) {
            const files = Array.from(e.target.files);
            if(files.length > 0 && deviceCount === 0) document.getElementById('gallery').innerHTML = "";
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const f = JSON.parse(ev.target.result);
                    f.rdMods = {}; // Inicializa bônus de RD manuais
                    createEmulator(f);
                };
                reader.readAsText(file);
            });
        }

        function createEmulator(f) {
            deviceCount++;
            const id = `dev-${deviceCount}`;
            const dev = document.createElement('div');
            dev.className = 'device'; dev.id = id;
            dev.innerHTML = `
                <button class="close-btn" onclick="this.parentElement.remove()">×</button>
                <div class="screen">
                    <div class="app-bar"><h2>${f.nome}</h2></div>
                    <div class="tabs">
                        <button class="tab-btn active" onclick="setTab('${id}', 'geral', this)">Geral</button>
                        <button class="tab-btn" onclick="setTab('${id}', 'traits', this)">Traços</button>
                        <button class="tab-btn" onclick="setTab('${id}', 'skills', this)">Perícias</button>
                        <button class="tab-btn" onclick="setTab('${id}', 'magia', this)">Magia</button>
                        <button class="tab-btn" onclick="setTab('${id}', 'itens', this)">Itens</button>
                        <button class="tab-btn" onclick="setTab('${id}', 'combate', this)">Combate</button>
                    </div>
                    <div class="sheet-body" id="${id}-body"></div>
                </div>
            `;
            document.getElementById('gallery').appendChild(dev);
            dev.dataset.ficha = JSON.stringify(f);
            renderContent(id, f, 'geral');
        }

        function renderContent(deviceId, f, tab) {
            const body = document.getElementById(`${deviceId}-body`);
            let html = "";
            const row = (l, r) => `<div class="list-row"><span>${l}</span> ${r}</div>`;
            const stats = (l, r, s) => `<div class="list-row"><span>${l}</span> <div class="controls"><button class="c-btn c-minus" onclick="updateStat('${deviceId}', '${s}', -1)">-</button><span style="width:40px;text-align:center;font-weight:bold">${r}</span><button class="c-btn c-plus" onclick="updateStat('${deviceId}', '${s}', 1)">+</button></div></div>`;

            let sMap = {};
            (f.pericias || []).forEach(p => {
                let b = (p.atributoBase === 'DX') ? f.destreza : (p.atributoBase === 'IQ' ? f.inteligencia : (p.atributoBase === 'HT' ? f.vitalidade : f.forca));
                let m = (p.dificuldade === "FACIL") ? (p.pontosGastos>=8?3 : p.pontosGastos>=4?2 : p.pontosGastos>=2?1 : 0) : 
                        (p.dificuldade === "MEDIA") ? (p.pontosGastos>=8?2 : p.pontosGastos>=4?1 : p.pontosGastos>=2?0 : -1) : 
                        (p.pontosGastos>=8?1 : p.pontosGastos>=4?0 : p.pontosGastos>=2?-1 : -2);
                sMap[p.definicaoId] = b + m;
            });

            if (tab === 'geral') {
                const spd = (f.destreza + f.vitalidade) / 4 + (f.modVelocidadeBasica || 0);
                const [gdp, geb] = getStDmg(f.forca);
                html = `<div class="attr-grid">
                    <div class="attr-box"><div class="attr-val">${f.forca}</div><div style="font-size:8px">ST</div></div>
                    <div class="attr-box"><div class="attr-val">${f.destreza}</div><div style="font-size:8px">DX</div></div>
                    <div class="attr-box"><div class="attr-val">${f.inteligencia}</div><div style="font-size:8px">IQ</div></div>
                    <div class="attr-box"><div class="attr-val">${f.vitalidade}</div><div style="font-size:8px">HT</div></div>
                </div>
                <div class="section-header">Derivados</div>
                ${row('Vontade (VON)', f.inteligencia + (f.modVontade || 0))}
                ${row('Percepção (PER)', f.inteligencia + (f.modPercepcao || 0))}
                ${row('Velocidade Básica', spd.toFixed(2))}
                ${row('Deslocamento', Math.floor(spd) + (f.modDeslocamentoBasico || 0))}
                ${row('Dano GdP / GeB', `<strong>${gdp} / ${geb}</strong>`)}
                <div class="section-header">Status</div>
                ${stats('Vida', `${f.pontosVidaRolagemAtual}/${f.vitalidade}`, 'vi')}
                ${stats('Fadiga', `${f.pontosFadigaRolagemAtual}/${f.vitalidade}`, 'fa')}`;
            } else if (tab === 'traits') {
                html = `<div class="section-header">Vantagens</div>` + (f.vantagens || []).map(v => row(v.nome, `<span class="tag">${v.custoEscolhido}pts</span>`)).join('') +
                       `<div class="section-header">Qualidades</div>` + (f.qualidades || []).map(q => row(q, "")).join('') +
                       `<div class="section-header">Desvantagens</div>` + (f.desvantagens || []).map(d => row(d.nome, `<span class="tag">${d.custoEscolhido}pts</span>`)).join('');
            } else if (tab === 'skills') {
                html = `<div class="section-header">Perícias</div>` + (f.pericias || []).map(p => row(p.nome, `<span class="nh-tag">${sMap[p.definicaoId]}</span>`)).join('') +
                       `<div class="section-header">Técnicas</div>` + (f.tecnicas || []).map(t => {
                           const b = sMap[t.periciaBaseDefinicaoId] || 10;
                           return row(t.nome, `<span class="nh-tag">${b + (t.preDefinidoModificador || 0) + (t.pontosGastos || 0)}</span>`);
                       }).join('');
            } else if (tab === 'magia') {
                html = `<div class="section-header">Grimório</div>` + (f.magias || []).map(m => row(m.nome, "NH ?")).join('');
            } else if (tab === 'itens') {
                html = `<div class="section-header">Armas</div>` + (f.equipamentos || []).filter(e => e.tipo === 'ARMA').map(e => row(e.nome, `<strong>${e.armaDanoRaw || ''}</strong>`)).join('') +
                       `<div class="section-header">Inventário</div>` + (f.equipamentos || []).filter(e => e.tipo !== 'ARMA').map(e => row(e.nome, `${e.quantidade || 1}x`)).join('');
            } else if (tab === 'combate') {
                html = `<div class="section-header">Status de Combate</div>` + stats('Vida', `${f.pontosVidaRolagemAtual}/${f.vitalidade}`, 'vi') + `<div class="section-header">Calculadora de Dano</div>`;
                const BODY = [{id:'cranio',n:'Crânio',r:2,m:4},{id:'rosto',n:'Rosto',r:0,m:1},{id:'corpo',n:'Torso',r:0,m:1},{id:'vitals',n:'Vitais',r:0,m:3},{id:'bracos',n:'Braços',r:0,m:1,l:0.5},{id:'pernas',n:'Pernas',r:0,m:1,l:0.5},{id:'maos',n:'Mãos',r:0,m:1,l:0.33},{id:'pes',n:'Pés',r:0,m:1,l:0.33}];
                BODY.forEach(loc => {
                    const arm = (f.equipamentos || []).find(e => e.armaduraLocal && e.armaduraLocal.toLowerCase().includes(loc.id.substring(0,3))) || { armaduraRd: 0 };
                    const mod = f.rdMods[loc.id] || 0;
                    const totalRD = loc.r + (parseInt(arm.armaduraRd) || 0) + mod;
                    html += `<div class="rd-card ${loc.m > 1 ? 'special' : ''}">
                        <div class="rd-info">
                            <span>${loc.n}</span> 
                            <div class="rd-badge">
                                <button class="c-btn c-minus" style="width:18px;height:18px" onclick="updateRD('${deviceId}','${loc.id}',-1)">-</button>
                                <span style="font-size:12px">RD ${totalRD}</span>
                                <button class="c-btn c-plus" style="width:18px;height:18px" onclick="updateRD('${deviceId}','${loc.id}',1)">+</button>
                            </div>
                        </div>
                        <div class="dmg-ctrl">
                            <input type="number" id="dmg-${deviceId}-${loc.id}" class="dmg-input" placeholder="D">
                            <select id="t-${deviceId}-${loc.id}" class="dmg-select">${Object.keys(DAMAGE_RULES).map(k => `<option value="${k}">${DAMAGE_RULES[k].n}</option>`).join('')}</select>
                            <button class="apply-btn" onclick="applySmartDmg('${deviceId}','${loc.id}',${totalRD},${loc.m},${loc.l || 0})">Ok</button>
                        </div>
                    </div>`;
                });
            }
            body.innerHTML = html;
        }

        function updateRD(devId, locId, delta) {
            const dev = document.getElementById(devId);
            const f = JSON.parse(dev.dataset.ficha);
            f.rdMods[locId] = (f.rdMods[locId] || 0) + delta;
            dev.dataset.ficha = JSON.stringify(f);
            renderContent(devId, f, 'combate');
        }

        function applySmartDmg(devId, locId, rd, m, limit) {
            const dev = document.getElementById(devId); const f = JSON.parse(dev.dataset.ficha);
            const val = parseInt(document.getElementById(`dmg-${devId}-${locId}`).value) || 0;
            const typeKey = document.getElementById(`t-${devId}-${locId}`).value;
            const penetrating = Math.max(0, val - rd);
            let mult = DAMAGE_RULES[typeKey].m;
            if (locId === 'cranio') mult = 4.0;
            if (locId === 'vitals' && (typeKey.startsWith('pi') || typeKey === 'perf')) mult = 3.0;
            let final = Math.floor(penetrating * mult);
            if (limit) { const max = Math.ceil(f.vitalidade * limit); if (final > max) final = max; }
            if (final > 0) updateStat(devId, 'vi', -final);
            document.getElementById(`dmg-${devId}-${locId}`).value = "";
        }

        function updateStat(devId, stat, delta) {
            const dev = document.getElementById(devId); const f = JSON.parse(dev.dataset.ficha);
            if (stat === 'vi') f.pontosVidaRolagemAtual += delta; if (stat === 'fa') f.pontosFadigaRolagemAtual += delta;
            dev.dataset.ficha = JSON.stringify(f);
            const active = dev.querySelector('.tab-btn.active').innerText.toLowerCase();
            const tabMap = { 'geral': 'geral', 'traços': 'traits', 'perícias': 'skills', 'magia': 'magia', 'itens': 'itens', 'combate': 'combate' };
            renderContent(devId, f, tabMap[active] || 'geral');
        }

        function setTab(id, tab, btn) {
            const dev = document.getElementById(id); const f = JSON.parse(dev.dataset.ficha);
            dev.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
            renderContent(id, f, tab);
        }
    </script>
</body>
</html>
