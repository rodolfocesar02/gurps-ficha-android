org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# Lote BUILD-1 (22/jul): a maquina tem 12 nucleos e o build usava praticamente um.
# O `build` dispara ~274 tarefas (22 de compilacao, 12 de lint, 9 de assemble, 8 de
# empacotamento) porque sao 2 variantes x 2 tipos de build. Os TESTES nao eram o gargalo:
# a suite inteira de uma variante roda em 12 segundos.
# parallel  = tarefas independentes (as 4 variantes) rodam ao mesmo tempo.
# caching   = reaproveita saida de tarefa cujas entradas nao mudaram, entre builds.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
