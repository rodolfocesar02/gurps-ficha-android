<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview de Ícones das Abas</title>
  <style>
    :root {
      --bg: #f3f5fa;
      --card: #ffffff;
      --text: #1f2533;
      --muted: #5a6478;
      --border: #d6dbea;
      --accent: #203462;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #eef2fb 0%, #f8f9fc 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 32px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: var(--accent);
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(10, 22, 44, 0.06);
    }
    .thumb {
      width: 84px;
      height: 84px;
      border-radius: 12px;
      border: 1px dashed #c4cbdd;
      display: grid;
      place-items: center;
      margin-bottom: 10px;
      background: #f7f9ff;
    }
    .thumb img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      image-rendering: auto;
    }
    .name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .file {
      font-size: 13px;
      color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Preview de Ícones das Abas</h1>
    <p>Abra este arquivo no navegador para comparar visualmente e escolher os ícones.</p>
    <div class="grid">
      <div class="card">
        <div class="thumb"><img src="app/src/main/res/drawable/tab_geral.png" alt="Ícone Geral" /></div>
        <div class="name">Geral</div>
        <div class="file">tab_geral.png</div>
      </div>
      <div class="card">
        <div class="thumb"><img src="app/src/main/res/drawable/tab_tracos.png" alt="Ícone Traços" /></div>
        <div class="name">Traços</div>
        <div class="file">tab_tracos.png</div>
      </div>
      <div class="card">
        <div class="thumb"><img src="app/src/main/res/drawable/tab_pericias.png" alt="Ícone Perícias" /></div>
        <div class="name">Perícias</div>
        <div class="file">tab_pericias.png</div>
      </div>
      <div class="card">
        <div class="thumb"><img src="app/src/main/res/drawable/tab_tecnicas.png" alt="Ícone Técnicas" /></div>
        <div class="name">Técnicas</div>
        <div class="file">tab_tecnicas.png</div>
      </div>
      <div class="card">
        <div class="thumb"><img src="app/src/main/res/drawable/tab_magia.png" alt="Ícone Magia" /></div>
        <div class="name">Magia</div>
        <div class="file">tab_magia.png</div>
      </div>
      <div class="card">
        <div class="thumb"><img src="app/src/main/res/drawable/tab_equipamentos.png" alt="Ícone Equipamentos" /></div>
        <div class="name">Equip.</div>
        <div class="file">tab_equipamentos.png</div>
      </div>
      <div class="card">
        <div class="thumb"><img src="app/src/main/res/drawable/tab_defesas.png" alt="Ícone Defesas" /></div>
        <div class="name">Defesas</div>
        <div class="file">tab_defesas.png</div>
      </div>
      <div class="card">
        <div class="thumb"><img src="app/src/main/res/drawable/tab_rolagem.png" alt="Ícone Rolagem" /></div>
        <div class="name">Rolagem</div>
        <div class="file">tab_rolagem.png</div>
      </div>
    </div>
  </div>
</body>
</html>
